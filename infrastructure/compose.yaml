name: clipgenius

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: clipgenius
      POSTGRES_PASSWORD: clipgenius
      POSTGRES_USER: clipgenius
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U clipgenius -d clipgenius']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - '5432:5432'
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    command: ['redis-server', '--appendonly', 'yes']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - '6379:6379'
    restart: unless-stopped
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
